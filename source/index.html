    <!-------------------FILE HANDLES OFFLINE MODE------------------------------->
    <script>
      let isSWExists = false;
      let uiSpinnetLoaded = false;
      let localVersion = 2;
      let UIVersion = 0;
      let versionLoaded = false
      let sheetToLoad = ''
      //////////////////////////////////////////////////////////////////////////////
      // Get unique number using time stamp
      function getUniqueNumber() {
        const now = new Date();
        const timestamp = now.getTime(); // Get the timestamp in milliseconds
        return timestamp;
      }
      //////////////////////////////////////////////////////////////////////////////
      // Load uiSnippet html
      // Checking Cors issues
      const loadSnippet = async (_ver) => {
        var sheetType = (getUrlVars()["sheet"]) ? getUrlVars()["sheet"].split('/')[0] : 'menu-en';
        var sheet_Id = (getUrlVars()["id"]) ? getUrlVars()["id"].split('/')[0] : '';
        // Fallback: extract from URL path /sheets/{id}/
        if (!sheet_Id) {
            var _pathParts = window.location.pathname.split('/');
            var _sheetsIdx = _pathParts.indexOf('sheets');
            if (_sheetsIdx >= 0 && _pathParts[_sheetsIdx + 1]) sheet_Id = _pathParts[_sheetsIdx + 1];
        }
        var activeLang = (getUrlVars()["code"]) ? getUrlVars()["code"].split('/')[0].toUpperCase() : navigator.language.split('-')[0].toUpperCase();

        var fromParent = (getUrlVars()["parent"]) ? getUrlVars()["parent"].split('/')[0] : '';
        var standalone = (getUrlVars()["standalone"]) ? getUrlVars()["standalone"].split('/')[0] : '';

        // Check screen orientation
        //var orientation = screen.orientation.type.split('-')[0]
         var orientation = ''
        if (window.matchMedia("(orientation: portrait)").matches) {
            // Portrait mode
            //console.log("Portrait mode");
            orientation = 'portrait-primary'
        } else {
            // Landscape mode
            //console.log("Landscape mode");
            orientation = 'landscape-primary'
        }

        // Check screen width
        var screenWidth = window.innerWidth; //screen.width;

        // Reset Styling
        if(fromParent == 'app' && orientation != 'landscape') {
          // Set Styling
          document.getElementById('content').style.setProperty('--screen-width', '100%');
          document.getElementById('content').style.setProperty('--screen-left', '0%');
        } else if((fromParent == 'app' || fromParent == '') && orientation == 'landscape') {
          // Set Styling
          document.getElementById('content').style.setProperty('--screen-width', '550px');
          document.getElementById('content').style.setProperty('--screen-width-max', '550px');
          document.getElementById('content').style.setProperty('--screen-width-min', '550px');
          document.getElementById('content').style.setProperty('--screen-left', ((screenWidth - 550)/2) + 'px');
        } else {
          // Set Styling
          document.getElementById('content').style.setProperty('--screen-width', '100%');
          document.getElementById('content').style.setProperty('--screen-left', '0%');
        }

        //alert(sheetType.split('-')[0])
        
        
        switch(sheetType.split('-')[0]) {
          case 'menu':
          case 'menus':
            console.log("MENU")
            sheetToLoad = '../../menu/index.html?version=' + _ver + "&code=" + activeLang
            break;
          case 'steps':
          case 'step':
            console.log("STEPS")
            sheetToLoad = '../../menu/index.html?version=' + _ver + "&code=" + activeLang + "&steps&" + fromParent + "&standalone=" + standalone 
            break;
          case 'faqs':
          case 'faq':
            console.log("FAQS")
            sheetToLoad = '../../menu/index.html?version=' + _ver + "&code=" + activeLang + "&faqs&" + fromParent
            break;
          case 'rules':
          case 'rule':
            console.log("RULES")
            sheetToLoad = '../../menu/index.html?version=' + _ver + "&code=" + activeLang + "&rules&" + fromParent
            break;
        }

        const res = await fetch(sheetToLoad, {
          method: 'GET',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json'
          },
        }).then(res => {
          if(res.ok) {
            return res.text()
          }
        }).then(htmlSnippet => {

          setTimeout(function() {
            $("#content").attr("src", sheetToLoad + "?code=" + activeLang + "&id=" + sheet_Id);
          }, 250) 
          uiSpinnetLoaded = true;

          // Loading updated Controller
          getControllerVersion(_ver)

          // Unregister any stale service workers from previous app versions
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) {
                var url = (reg.active || reg.installing || reg.waiting || {}).scriptURL || '';
                if (!url.includes('sw_playbookHomeApp')) reg.unregister();
              });
            });
          }

          // Hide default screen
          document.getElementById('defaultScreen').style.display = 'none'
          const registerServiceWorker = async () => {
            if ("serviceWorker" in navigator) {
              try {
                // Build an absolute SW path so it resolves correctly whether or
                // not the URL has a trailing slash (e.g. /sheets/ID vs /sheets/ID/)
                var _swDir = window.location.pathname;
                if (!_swDir.endsWith('/')) _swDir += '/';
                const registration = await navigator.serviceWorker.register(_swDir + "sw_playbookHomeApp.js?version=" + _ver, {
                  scope: _swDir,
                });
                if (registration.installing) {
                  isSWExists = false
                } else if (registration.waiting) {
                  isSWExists = false
                } else if (registration.active) {
                  isSWExists = true
                }
              } catch (error) {
                console.error(`Registration failed with ${error}`);
              }
            }
          };
          registerServiceWorker();
          if(window.navigator.onLine == true) {
            CheckNetConnection();
          } else {
          }
          // Checking internet speed
          function CheckNetConnection() {
            if(window.navigator.onLine == true) {
              var netStartTime = new Date().getTime();
              var img = new Image();
              img.onload = function() {
                var netLoadTime = new Date().getTime() - netStartTime;
                checkConnectionSpeed(netLoadTime);
              }
              img.src = "../../images/zapsheets.png?version=" + Math.random()
            }
          }
          function checkConnectionSpeed(milliseconds) {
            if(window.navigator.onLine == true) {
              let downloadSize = 399000; //1024 * 1024 * 5;
              var duration = (milliseconds) / 1000;
              var bitsLoaded = downloadSize * 8;
              var bps = (bitsLoaded / duration).toFixed(2);
              var kbps = (bps / 1024).toFixed(2);
              var mbps = (kbps / 1024).toFixed(2);
            }
          }
        })
      }
      /////////////////////////////////////////////////////////////////////////////////
      function loadInternetSettings(_ver) {
        var inetScript = document.createElement('script');
        inetScript.id = 'inet_Script';
        inetScript.type = 'text/javascript';
        inetScript.src = '../../js/main/getInternetStat.js?version=' + _ver;
        document.getElementsByTagName('head')[0].appendChild(inetScript);
      }
      /////////////////////////////////////////////////////////////////////////////////
      /*
      * getControllerVersion
      */
      function getControllerVersion(_ver) {
        var conScript = document.createElement('script');
        conScript.id = 'controller_Script';
        conScript.type = 'text/javascript';
        conScript.src = '../../js/main/JSController.js?version=' + _ver;
        document.getElementsByTagName('head')[0].appendChild(conScript);
      }
      /////////////////////////////////////////////////////////////////////////////////
      /*
      * getLatestGameCSSFile
      */
      function getLatestGameCSSFile(_ver) {
        let cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.type = 'text/css';
        cssLink.href = '../../css/style.css?version=' + _ver;
        document.getElementsByTagName('head')[0].appendChild(cssLink);
      }
      /////////////////////////////////////////////////////////////////////////////////
      /**
       * 
       * @returns 
       */
      function getUrlVars() {
          var vars = [], hash;
          var hashes = window.location.href.slice(window.location.href.indexOf('?') + 1).split('&');
          for (var i = 0; i < hashes.length; i++) {
              hash = hashes[i].split('=');
              vars.push(hash[0]);
              vars[hash[0]] = hash[1];
          }
        return vars;
      }
      //////////////////////////////////////////////////////////////////////////
      const checkOnlineStatus = async () => {
        try {
          // Request a small, non-cached file (e.g., a 1x1 pixel image or an empty JSON)
          const online = await fetch("../../images/zapsheets.png?_=" + new Date().getTime());
          // Check if the response status is okay (200-299)
          return online.status >= 200 && online.status < 300;
        } catch (err) {
          // A network error occurred, definitely offline
          return false;
        }
      };
      //////////////////////////////////////////////////////////////////////////
      setTimeout(function() {
        if(window.ldb != undefined) {
          window.ldb.get('homeAppPlaybookUIVersion', function (value) {

            /* (async () => {
              const online = await checkOnlineStatus();
              if (online) {
                console.log("Internet is available!");
                UIVersion = getUniqueNumber();
                  window.ldb.set('homeAppPlaybookUIVersion', UIVersion)
                  getLatestGameCSSFile(UIVersion)
                  loadSnippet(UIVersion)
              } else {
                console.log("No internet connection.");
                // Display an offline data to the user.
                UIVersion = value
                getLatestGameCSSFile(UIVersion)
                loadSnippet(UIVersion)
              }
            })(); */
            
            if(navigator.onLine == true) {
              //alert('online')
              UIVersion = getUniqueNumber();
              window.ldb.set('homeAppPlaybookUIVersion', UIVersion)
              getLatestGameCSSFile(UIVersion)
              loadSnippet(UIVersion)
            } else {
              //alert('offline')
              UIVersion = value
              getLatestGameCSSFile(UIVersion)
              loadSnippet(UIVersion)
            }
          })
        } else {
          UIVersion = getUniqueNumber();
          window.ldb.set('homeAppPlaybookUIVersion', UIVersion)
          getLatestGameCSSFile(UIVersion)
          loadSnippet(UIVersion)
        }
      }, 3000)
    </script>
